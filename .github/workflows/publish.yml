name: Publish to PyPI

# Runs when a GitHub Release is published (tag like v0.3.0). Uses PyPI
# "trusted publishing" (OIDC), so no API token is stored in the repo.
# One-time setup: https://pypi.org/manage/account/publishing/ -> add a
# pending publisher for project "cspan", owner "hanifsajid", repo "cspan",
# workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg=$(python -c "import tomllib,re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/cspan/_version.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package=$pkg tag=$tag"
          test "$pkg" = "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cspan
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
