site_name: cspan
site_description: A Python client for the C-SPAN Archives API.
site_url: https://hanifsajid.com/cspan/
repo_url: https://github.com/hanifsajid/cspan
repo_name: hanifsajid/cspan
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Hanif Sajid &middot; MIT License &middot; Unofficial, not affiliated with C-SPAN.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://hanifsajid.com
      name: hanifsajid.com
    - icon: fontawesome/brands/github
      link: https://github.com/hanifsajid
      name: hanifsajid on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:hanifwrites@gmail.com
      name: Email the maintainer

nav:
  - Home: index.md
  - Usage guide: usage.md
  - Endpoints & live API notes: endpoints.md
  - API reference: reference.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

watch:
  - src
  - CHANGELOG.md
